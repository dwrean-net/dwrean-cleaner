name: Test and release dwrean Cleaner Portable

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dwrean-cleaner-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Safety tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    name: Windows x64 icon + version + tests + release
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test on Windows
        run: go test ./...
      - name: Generate official dwrean.net icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/create_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Embed brand icon and Windows file-version metadata
        shell: pwsh
        run: |
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 versioninfo.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path resource.syso)) { throw 'No Windows icon/version resource generated' }
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/dwrean-cleaner-portable.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = (Get-Item dist/dwrean-cleaner-portable.exe).VersionInfo
          if (!$info.FileVersion.StartsWith('1.0.0')) { throw "Missing Windows file version: $($info.FileVersion)" }
          if ($info.ProductName -ne 'dwrean Cleaner Portable') { throw "Missing product metadata: $($info.ProductName)" }
          Compress-Archive -Path dist/dwrean-cleaner-portable.exe -DestinationPath dist/dwrean-cleaner-portable.zip -Force
          (Get-FileHash dist/dwrean-cleaner-portable.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  dwrean-cleaner-portable.exe' | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dwrean-cleaner-portable-v1.0.0-windows-x64
          path: |
            dist/dwrean-cleaner-portable.exe
            dist/dwrean-cleaner-portable.zip
            dist/SHA256SUMS.txt
      - name: Publish v1.0.0 stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          $assets = @('dist/dwrean-cleaner-portable.exe','dist/dwrean-cleaner-portable.zip','dist/SHA256SUMS.txt')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title 'dwrean Cleaner Portable v1.0.0' --notes 'Πρώτη ολοκληρωμένη έκδοση: εικονίδιο dwrean.net, ελληνικό παράθυρο «Περί» με ενεργούς συνδέσμους, πληροφορίες δημιουργού/έκδοσης και ασφαλής καθαρισμός με ένα κλικ. Windows 10/11 (64-bit). Δωρεάν / Portable / MIT. Το εκτελέσιμο δεν είναι ψηφιακά υπογεγραμμένο.' --latest --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
